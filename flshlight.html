<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Flashlight Effect</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: white;
      overflow: hidden;
    }

    .content {
      position: absolute;
      top: 90%;
      left: 20%;
      transform: translate(-50%, -50%);
      font-size: 3rem;
      color: black;
      text-align: center;
    }

    .overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        circle 120px at 50% 50%,
        transparent 0%,
        rgba(0, 0, 0, 0.95) 70%
      );
    }

    #button a {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 1rem 2rem;
      background: #fefefe a;
      color: white;
      font-size: 1.5rem;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="button"><a href="./files/folder">Click me</a></div>

  <div class="content">
    00000001 01010000
  </div>

  <div class="overlay" id="overlay"></div>

  <script>
    const overlay = document.getElementById("overlay");

    document.addEventListener("mousemove", (e) => {
      overlay.style.background = `
        radial-gradient(
          circle 150px at ${e.clientX}px ${e.clientY}px,
          transparent 0%,
          rgba(0, 0, 0, 0.95) 70%
        )
      `;
    });
  </script>

</body>
</html>
